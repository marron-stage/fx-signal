<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>日足 200EMA 環境認識 (厳選7通貨)</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --card-sub: #0f172a;
      --border: #334155;
      --text: #f8fafc;
      --muted: #94a3b8;
      --buy: #10b981;
      --sell: #ef4444;
      --accent: #38bdf8;
      --warn: #facc15;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 12px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    .container { max-width: 900px; margin: 0 auto; }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 6px;
      margin-bottom: 10px;
      flex-wrap: wrap;
    }
    h1 { font-size: 1.02rem; margin: 0; }
    .header-btns { display: flex; gap: 6px; align-items: center; }
    button, .nav-link {
      background: var(--card);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 7px;
      padding: 6px 10px;
      font-size: 0.76rem;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
    }
    button.primary { background: var(--accent); color: #0f172a; border: none; }
    .nav-link { background: #334155; color: #e2e8f0; border: none; }
    button.clear-btn {
      background: rgba(239, 68, 68, 0.14);
      border: 1px solid rgba(239, 68, 68, 0.4);
      color: #fca5a5;
      font-size: 0.72rem;
      padding: 6px 8px;
    }
    button:active { opacity: 0.85; }

    .banner {
      padding: 9px 10px;
      border-radius: 8px;
      margin-bottom: 12px;
      font-weight: 700;
      text-align: center;
      background: var(--card);
      border: 1px solid var(--border);
      font-size: 0.82rem;
      line-height: 1.45;
    }
    .meta { font-size: 0.7rem; color: var(--muted); font-weight: 400; }

    /* スマホ横2列・タブレット/PC横3〜4列 */
    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 9px;
    }
    @media (min-width: 700px) {
      .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 11px; }
    }
    @media (min-width: 900px) {
      .grid { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-width: 0;
    }
    .card.up-strong {
      border: 1.5px solid rgba(16, 185, 129, 0.65);
      background: linear-gradient(180deg, rgba(16, 185, 129, 0.08) 0%, var(--card) 100%);
    }
    .card.down-strong {
      border: 1.5px solid rgba(239, 68, 68, 0.65);
      background: linear-gradient(180deg, rgba(239, 68, 68, 0.08) 0%, var(--card) 100%);
    }

    .pair-title {
      display: flex;
      flex-direction: column;
      line-height: 1.2;
      margin-bottom: 6px;
    }
    .pair-en { font-size: 0.96rem; font-weight: 800; letter-spacing: 0.01em; }
    .pair-jp { font-size: 0.74rem; color: #cbd5e1; font-weight: 600; margin-top: 1px; }

    .dir-badge {
      display: block;
      text-align: center;
      padding: 5px 6px;
      border-radius: 6px;
      font-size: 0.76rem;
      font-weight: 800;
      margin-bottom: 7px;
    }
    .dir-up {
      background: rgba(16, 185, 129, 0.2);
      color: #34d399;
      border: 1px solid rgba(16, 185, 129, 0.4);
    }
    .dir-down {
      background: rgba(239, 68, 68, 0.2);
      color: #f87171;
      border: 1px solid rgba(239, 68, 68, 0.4);
    }
    .dir-mix {
      background: rgba(148, 163, 184, 0.14);
      color: #cbd5e1;
      border: 1px solid rgba(148, 163, 184, 0.3);
    }

    .rates-box {
      background: var(--card-sub);
      border-radius: 6px;
      padding: 6px 8px;
      font-size: 0.73rem;
      line-height: 1.5;
    }
    .row-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .label { color: var(--muted); font-size: 0.69rem; }
    .val { font-weight: 700; }

    .guide {
      margin-top: 14px;
      padding: 10px 12px;
      background: var(--card);
      border-radius: 8px;
      font-size: 0.75rem;
      color: var(--muted);
      line-height: 1.55;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>📊 日足 200EMA 環境認識 (7通貨)</h1>
      <div class="header-btns">
        <a href="./1h.html" class="nav-link">⏱ 1時間足へ</a>
        <button class="clear-btn" onclick="clearOldStorage()">旧データ消去</button>
        <button class="primary" onclick="checkAll()">更新</button>
      </div>
    </header>

    <div id="statusBanner" class="banner">日足200EMAを取得中...</div>

    <div id="cards" class="grid"></div>

    <div class="guide">
      <strong>使い方（朝の環境認識ルール）：</strong><br>
      ・<strong style="color:#34d399;">📈 上目線（買いのみ）</strong>：終値が200EMAより上 ＆ 200EMAが上向き → 1時間足で「買い」だけ狙う<br>
      ・<strong style="color:#f87171;">📉 下目線（売りのみ）</strong>：終値が200EMAより下 ＆ 200EMAが下向き → 1時間足で「売り」だけ狙う<br>
      ・<strong style="color:#cbd5e1;">⚠️ 方向迷い中</strong>：価格と200EMAの傾きが逆 → 無理に触らない
    </div>
  </div>

  <script>
    // 流動性トップ7通貨ペア
    const PAIRS = [
      { code: "EUR/USD", jp: "ユーロ/ドル" },
      { code: "USD/JPY", jp: "ドル/円" },
      { code: "GBP/USD", jp: "ポンド/ドル" },
      { code: "EUR/JPY", jp: "ユーロ/円" },
      { code: "GBP/JPY", jp: "ポンド/円" },
      { code: "AUD/USD", jp: "豪ドル/ドル" },
      { code: "AUD/JPY", jp: "豪ドル/円" }
    ];

    function clearOldStorage() {
      if (!confirm("ブラウザに保存されている過去のトレード履歴・古い通貨データをすべて消去しますか？")) return;
      localStorage.removeItem("qqe_positions");
      localStorage.removeItem("qqe_history");
      localStorage.removeItem("qqe_glaz_pairs_v3");
      localStorage.removeItem("qqe_glaz_pairs_7_v1");
      alert("過去の保存データをすべて消去しました！");
    }

    function calcEma(values, length) {
      const k = 2 / (length + 1);
      const out = [values[0]];
      for (let i = 1; i < values.length; i++) {
        out.push(values[i] * k + out[i - 1] * (1 - k));
      }
      return out;
    }

    async function fetchDailyCloses(base, quote) {
      const end = new Date(Date.now() + 9 * 60 * 60 * 1000 + 24 * 60 * 60 * 1000);
      const start = new Date(end.getTime() - 335 * 24 * 60 * 60 * 1000);
      const fmt = d => d.toISOString().split("T")[0];
      const url = `https://api.frankfurter.dev/v1/${fmt(start)}..${fmt(end)}?base=${base}&symbols=${quote}&_=${Date.now()}`;
      const res = await fetch(url, { cache: "no-store" });
      if (!res.ok) throw new Error("取得失敗");
      const data = await res.json();
      const dates = Object.keys(data.rates).sort();
      return {
        dates,
        closes: dates.map(d => data.rates[d][quote])
      };
    }

    async function checkAll() {
      const banner = document.getElementById("statusBanner");
      const grid = document.getElementById("cards");
      banner.textContent = "7通貨の日足200EMAを計算中...";
      grid.innerHTML = "";

      const results = await Promise.all(PAIRS.map(async (item) => {
        const [base, quote] = item.code.split("/");
        try {
          const { dates, closes } = await fetchDailyCloses(base, quote);
          const ema200Arr = calcEma(closes, 200);
          const last = closes.length - 1;
          const prev = closes.length - 2;

          const closeNow = closes[last];
          const emaNow = ema200Arr[last];
          const emaPrev = ema200Arr[prev];

          const aboveEma = closeNow > emaNow;
          const emaRising = emaNow >= emaPrev;
          const decimals = closeNow > 20 ? 2 : 4;

          let direction = "mix";
          if (aboveEma && emaRising) direction = "up";
          else if (!aboveEma && !emaRising) direction = "down";

          return {
            ...item,
            lastDate: dates[last],
            close: closeNow.toFixed(decimals),
            ema200: emaNow.toFixed(decimals),
            aboveEma,
            emaRising,
            direction
          };
        } catch (err) {
          return { ...item, error: true };
        }
      }));

      // 上目線・下目線がハッキリしている通貨を上に並べる
      results.sort((a, b) => {
        if (a.error) return 1;
        if (b.error) return -1;
        const score = r => (r.direction === "up" || r.direction === "down") ? 10 : 0;
        return score(b) - score(a);
      });

      const valid = results.find(r => !r.error);
      const dateStr = valid ? `最新確定日足: ${valid.lastDate}` : "";
      const upList = results.filter(r => r.direction === "up").map(r => r.jp);
      const downList = results.filter(r => r.direction === "down").map(r => r.jp);

      banner.innerHTML = `
        <span style="color:#34d399;">📈 上目線: ${upList.length}通貨</span> ／ 
        <span style="color:#f87171;">📉 下目線: ${downList.length}通貨</span><br>
        <span class="meta">${dateStr}</span>
      `;

      for (const r of results) {
        const card = document.createElement("div");
        card.className = "card" + (r.direction === "up" ? " up-strong" : r.direction === "down" ? " down-strong" : "");

        if (r.error) {
          card.innerHTML = `
            <div class="pair-title">
              <span class="pair-en">${r.code}</span>
              <span class="pair-jp">${r.jp}</span>
            </div>
            <div class="meta">取得エラー</div>
          `;
        } else {
          let badgeHtml = "";
          if (r.direction === "up") {
            badgeHtml = `<div class="dir-badge dir-up">📈 上目線（買いのみ）</div>`;
          } else if (r.direction === "down") {
            badgeHtml = `<div class="dir-badge dir-down">📉 下目線（売りのみ）</div>`;
          } else {
            badgeHtml = `<div class="dir-badge dir-mix">⚠️ 方向迷い中</div>`;
          }

          card.innerHTML = `
            <div>
              <div class="pair-title">
                <span class="pair-en">${r.code}</span>
                <span class="pair-jp">${r.jp}</span>
              </div>
              ${badgeHtml}
            </div>
            <div class="rates-box">
              <div class="row-item">
                <span class="label">終値</span>
                <span class="val">${r.close}</span>
              </div>
              <div class="row-item">
                <span class="label">200EMA</span>
                <span class="val">${r.ema200} (${r.emaRising ? "↗" : "↘"})</span>
              </div>
            </div>
          `;
        }
        grid.appendChild(card);
      }
    }

    checkAll();
  </script>
</body>
</html>
