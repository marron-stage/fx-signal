<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>1時間足 QQE + MACD(5・20・9) シグナル (8通貨)</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --card-sub: #0f172a;
      --border: #334155;
      --text: #f8fafc;
      --muted: #94a3b8;
      --buy: #10b981;
      --sell: #ef4444;
      --accent: #38bdf8;
      --warn: #facc15;
      --hot: #f97316;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 10px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    .container { max-width: 960px; margin: 0 auto; }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 6px;
      margin-bottom: 8px;
      flex-wrap: wrap;
    }
    h1 { font-size: 0.98rem; margin: 0; }
    .header-btns { display: flex; gap: 6px; align-items: center; }
    .nav-link {
      background: #334155;
      color: #e2e8f0;
      text-decoration: none;
      padding: 6px 9px;
      border-radius: 7px;
      font-size: 0.74rem;
      font-weight: 600;
    }
    .api-bar {
      display: flex;
      gap: 6px;
      align-items: center;
      background: var(--card);
      border: 1px solid var(--border);
      padding: 7px 9px;
      border-radius: 8px;
      margin-bottom: 8px;
      flex-wrap: wrap;
    }
    .api-bar input {
      flex: 1;
      min-width: 140px;
      background: var(--card-sub);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 5px 8px;
      font-size: 0.78rem;
    }
    button {
      background: var(--card);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 7px;
      padding: 6px 10px;
      font-size: 0.76rem;
      font-weight: 600;
      cursor: pointer;
    }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    button.primary { background: var(--accent); color: #0f172a; border: none; padding: 6px 14px; }
    button:active { opacity: 0.85; }

    .banner {
      padding: 9px 10px;
      border-radius: 8px;
      margin-bottom: 10px;
      font-weight: 700;
      text-align: center;
      background: var(--card);
      border: 1px solid var(--border);
      font-size: 0.82rem;
      line-height: 1.45;
    }
    .banner.alert {
      background: rgba(249, 115, 22, 0.18);
      border-color: var(--hot);
      color: #fed7aa;
    }
    .meta { font-size: 0.69rem; color: var(--muted); font-weight: 400; }

    /* スマホ横2列・PC横3〜4列 */
    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
    }
    @media (min-width: 720px) {
      .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
    }
    @media (min-width: 940px) {
      .grid { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 9px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-width: 0;
    }
    .card.go-buy {
      border: 2px solid var(--buy);
      background: linear-gradient(180deg, rgba(16, 185, 129, 0.1) 0%, var(--card) 100%);
    }
    .card.go-sell {
      border: 2px solid var(--sell);
      background: linear-gradient(180deg, rgba(239, 68, 68, 0.1) 0%, var(--card) 100%);
    }
    .card.early {
      border: 2px solid var(--warn);
    }

    .pair-title {
      display: flex;
      flex-direction: column;
      line-height: 1.2;
      margin-bottom: 5px;
    }
    .pair-en { font-size: 0.94rem; font-weight: 800; }
    .pair-jp { font-size: 0.72rem; color: #cbd5e1; font-weight: 600; margin-top: 1px; }

    .status-pill {
      display: block;
      text-align: center;
      padding: 6px 4px;
      border-radius: 6px;
      font-size: 0.82rem;
      font-weight: 900;
      margin-bottom: 6px;
    }
    .pill-go-buy {
      background: rgba(16, 185, 129, 0.24);
      color: #34d399;
      border: 1px solid rgba(16, 185, 129, 0.55);
    }
    .pill-go-sell {
      background: rgba(239, 68, 68, 0.24);
      color: #f87171;
      border: 1px solid rgba(239, 68, 68, 0.55);
    }
    .pill-early {
      background: rgba(250, 204, 21, 0.2);
      color: #fef08a;
      border: 1px solid rgba(250, 204, 21, 0.5);
    }
    .pill-wait {
      background: rgba(148, 163, 184, 0.14);
      color: #cbd5e1;
      border: 1px solid rgba(148, 163, 184, 0.3);
    }

    .ind-box {
      background: var(--card-sub);
      border-radius: 6px;
      padding: 5px 6px;
      font-size: 0.69rem;
      line-height: 1.45;
      margin-bottom: 6px;
      color: #cbd5e1;
    }
    .up-txt { color: #34d399; font-weight: 700; }
    .down-txt { color: #f87171; font-weight: 700; }

    .price-targets {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }
    .target-row {
      background: rgba(15, 23, 42, 0.75);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 5px 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 4px;
    }
    .target-info {
      display: flex;
      flex-direction: column;
      line-height: 1.25;
      min-width: 0;
    }
    .target-label {
      font-size: 0.64rem;
      font-weight: 700;
    }
    .tp-label { color: #34d399; }
    .sl-label { color: #f87171; }
    .target-val {
      font-size: 0.84rem;
      font-weight: 800;
      color: #f8fafc;
      font-variant-numeric: tabular-nums;
    }
    .target-pips {
      font-size: 0.62rem;
      color: var(--muted);
    }
    .copy-btn {
      background: #334155;
      color: #f8fafc;
      border: none;
      border-radius: 5px;
      padding: 5px 7px;
      font-size: 0.66rem;
      font-weight: 700;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .copy-btn.copied {
      background: #10b981;
      color: #0f172a;
    }

    .settings {
      margin-top: 14px;
      padding: 10px;
      background: var(--card);
      border-radius: 8px;
      font-size: 0.74rem;
      color: var(--muted);
      line-height: 1.5;
    }
    .settings input {
      background: var(--card-sub);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 5px;
      width: 56px;
      padding: 3px 5px;
      margin: 3px 5px 3px 2px;
      font-size: 0.74rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>⏱ 1H QQE + MACD(5・20・9)</h1>
      <div class="header-btns">
        <a href="./index.html" class="nav-link">📊 日足へ</a>
        <button id="updateBtn" class="primary" onclick="checkAll()">更新</button>
      </div>
    </header>

    <div class="api-bar">
      <span class="meta">APIキー:</span>
      <input id="apiKeyInput" type="password" placeholder="Twelve Data APIキーを貼り付けて保存" />
      <button onclick="saveApiKey()">保存</button>
      <span id="apiStatus" class="meta"></span>
    </div>

    <div id="statusBanner" class="banner">APIキーを保存して「更新」を押してください</div>

    <div id="cards" class="grid"></div>

    <div class="settings">
      <strong>設定（目安計算・QQE）:</strong><br>
      利確倍率 <input id="rrRatio" type="number" step="0.1" value="1.5" />倍（損切り幅に対して）
      ／ Fast <input id="fastParam" type="number" step="0.0001" value="2.6180" />
      Slow <input id="slowParam" type="number" step="0.0001" value="4.2360" />
      <button onclick="checkAll()">再計算</button>
      <div style="margin-top: 4px;">
        ※損切りは「直近6時間の最安値(最高値)の少し外側」、利確は「損切り幅 × 倍率」の値段を自動計算します。
      </div>
    </div>
  </div>

  <script>
    const PAIRS = [
      { code: "EUR/USD", jp: "ユーロ/ドル" },
      { code: "USD/JPY", jp: "ドル/円" },
      { code: "GBP/USD", jp: "ポンド/ドル" },
      { code: "EUR/JPY", jp: "ユーロ/円" },
      { code: "GBP/JPY", jp: "ポンド/円" },
      { code: "AUD/USD", jp: "豪ドル/ドル" },
      { code: "AUD/JPY", jp: "豪ドル/円" },
      { code: "GBP/AUD", jp: "ポンド/豪ドル" }
    ];

    let apiKey = localStorage.getItem("twelvedata_api_key") || "";
    if (apiKey) {
      document.getElementById("apiKeyInput").value = apiKey;
      document.getElementById("apiStatus").textContent = "✅ 保存済";
    }

    let isFetching = false;
    let cooldownTimer = null;

    function startCooldown(seconds = 62) {
      const btn = document.getElementById("updateBtn");
      if (!btn) return;
      if (cooldownTimer) clearInterval(cooldownTimer);
      let rem = seconds;
      btn.disabled = true;
      btn.textContent = `待機 ${rem}s`;
      cooldownTimer = setInterval(() => {
        rem -= 1;
        if (rem <= 0) {
          clearInterval(cooldownTimer);
          cooldownTimer = null;
          btn.disabled = false;
          btn.textContent = "更新";
        } else {
          btn.textContent = `待機 ${rem}s`;
        }
      }, 1000);
    }

    function saveApiKey() {
      const val = document.getElementById("apiKeyInput").value.trim();
      apiKey = val;
      localStorage.setItem("twelvedata_api_key", val);
      document.getElementById("apiStatus").textContent = val ? "✅ 保存済" : "未設定";
      if (val && !isFetching) checkAll();
    }

    async function copyPrice(btn, priceStr) {
      try {
        await navigator.clipboard.writeText(priceStr);
      } catch (e) {
        const ta = document.createElement("textarea");
        ta.value = priceStr;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand("copy");
        document.body.removeChild(ta);
      }
      const orig = btn.textContent;
      btn.textContent = "✅ コピー済";
      btn.classList.add("copied");
      setTimeout(() => {
        btn.textContent = orig;
        btn.classList.remove("copied");
      }, 1600);
    }

    function pineRsi(closes, length) {
      const n = closes.length;
      const rsi = new Array(n).fill(50);
      if (n <= length) return rsi;
      let gainSum = 0, lossSum = 0;
      for (let i = 1; i <= length; i++) {
        const diff = closes[i] - closes[i - 1];
        if (diff > 0) gainSum += diff;
        else lossSum -= diff;
      }
      let avgGain = gainSum / length;
      let avgLoss = lossSum / length;
      rsi[length] = avgLoss === 0 ? 100 : 100 - (100 / (1 + avgGain / avgLoss));
      for (let i = length + 1; i < n; i++) {
        const diff = closes[i] - closes[i - 1];
        const g = diff > 0 ? diff : 0;
        const l = diff < 0 ? -diff : 0;
        avgGain = (avgGain * (length - 1) + g) / length;
        avgLoss = (avgLoss * (length - 1) + l) / length;
        rsi[i] = avgLoss === 0 ? 100 : 100 - (100 / (1 + avgGain / avgLoss));
      }
      return rsi;
    }

    function pineEma(values, length) {
      const k = 2 / (length + 1);
      const out = [values[0]];
      for (let i = 1; i < values.length; i++) {
        out.push(values[i] * k + out[i - 1] * (1 - k));
      }
      return out;
    }

    function wima(values, length) {
      const out = new Array(values.length).fill(0);
      out[0] = values[0] / length;
      for (let i = 1; i < values.length; i++) {
        out[i] = (values[i] + out[i - 1] * (length - 1)) / length;
      }
      return out;
    }

    function analyzePair(pair, bars, fast = 2.618, slow = 4.236, rrRatio = 1.5) {
      const closes = bars.map(b => b.close);
      const highs = bars.map(b => b.high);
      const lows = bars.map(b => b.low);
      const n = closes.length;

      // 1. QQE (14, 2)
      const rawRsi = pineRsi(closes, 14);
      const rsIndex = pineEma(rawRsi, 2);
      const tr = new Array(n).fill(0);
      for (let i = 1; i < n; i++) {
        const th = rsIndex[i - 1] > rsIndex[i] ? rsIndex[i - 1] : rsIndex[i];
        const tl = rsIndex[i - 1] < rsIndex[i] ? rsIndex[i - 1] : rsIndex[i];
        tr[i] = th - tl;
      }
      const atrRsi = wima(tr, 14);
      const smoothedAtrRsi = wima(atrRsi, 14);
      const deltaFast = smoothedAtrRsi.map(v => v * fast);
      const deltaSlow = smoothedAtrRsi.map(v => v * slow);

      const longband = new Array(n).fill(0), shortband = new Array(n).fill(0), trend = new Array(n).fill(1), fastTL = new Array(n).fill(0);
      const longband1 = new Array(n).fill(0), shortband1 = new Array(n).fill(0), trend1 = new Array(n).fill(1), slowTL = new Array(n).fill(0);

      for (let i = 1; i < n; i++) {
        const newShort = rsIndex[i] + deltaFast[i];
        const newLong = rsIndex[i] - deltaFast[i];
        longband[i] = (rsIndex[i - 1] > longband[i - 1] && rsIndex[i] > longband[i - 1]) ? Math.max(longband[i - 1], newLong) : newLong;
        shortband[i] = (rsIndex[i - 1] < shortband[i - 1] && rsIndex[i] < shortband[i - 1]) ? Math.min(shortband[i - 1], newShort) : newShort;
        const crossUpFast = rsIndex[i - 1] <= shortband[i - 1] && rsIndex[i] > shortband[i - 1];
        const crossDownFast = longband[i - 1] <= rsIndex[i - 1] && longband[i - 1] > rsIndex[i];
        trend[i] = crossUpFast ? 1 : (crossDownFast ? -1 : trend[i - 1]);
        fastTL[i] = trend[i] === 1 ? longband[i] : shortband[i];

        const newShort1 = rsIndex[i] + deltaSlow[i];
        const newLong1 = rsIndex[i] - deltaSlow[i];
        longband1[i] = (rsIndex[i - 1] > longband1[i - 1] && rsIndex[i] > longband1[i - 1]) ? Math.max(longband1[i - 1], newLong1) : newLong1;
        shortband1[i] = (rsIndex[i - 1] < shortband1[i - 1] && rsIndex[i] < shortband1[i - 1]) ? Math.min(shortband1[i - 1], newShort1) : newShort1;
        const crossUpSlow = rsIndex[i - 1] <= shortband1[i - 1] && rsIndex[i] > shortband1[i - 1];
        const crossDownSlow = longband1[i - 1] <= rsIndex[i - 1] && longband1[i - 1] > rsIndex[i];
        trend1[i] = crossUpSlow ? 1 : (crossDownSlow ? -1 : trend1[i - 1]);
        slowTL[i] = trend1[i] === 1 ? longband1[i] : shortband1[i];
      }

      const last = n - 1, prev = n - 2, prev2 = n - 3;
      const qqeBuy = fastTL[last] > slowTL[last];

      // 2. MACD (5, 20, 9) の短期線(ピンク線)角度判定
      const ema5 = pineEma(closes, 5);
      const ema20 = pineEma(closes, 20);
      const macdLine = ema5.map((v, idx) => v - ema20[idx]);
      const signalLine = pineEma(macdLine, 9);

      const m0 = macdLine[last];
      const m1 = macdLine[prev];
      const m2 = macdLine[prev2];

      const macdUp = m0 > m1; // 最新足でピンク線が上向き
      const macdTurnedUp = m2 >= m1 && m1 < m0; // クイッと上向きに折り返した1本目
      const macdTurnedDown = m2 <= m1 && m1 > m0; // クイッと下向きに折り返した1本目

      // ステータス分類
      // go_buy: QQE=BUY かつ MACD上向き
      // go_sell: QQE=SELL かつ MACD下向き
      // early_buy: MACDがクイッと上向き転換（初動）
      // early_sell: MACDがクイッと下向き転換（初動）
      // wait: 勢い一服・調整中
      let statusType = "wait";
      let targetSide = qqeBuy ? "BUY" : "SELL";

      if (qqeBuy && macdUp) {
        statusType = "go_buy";
        targetSide = "BUY";
      } else if (!qqeBuy && !macdUp) {
        statusType = "go_sell";
        targetSide = "SELL";
      } else if (macdTurnedUp) {
        statusType = "early_buy";
        targetSide = "BUY";
      } else if (macdTurnedDown) {
        statusType = "early_sell";
        targetSide = "SELL";
      } else {
        statusType = "wait";
        targetSide = macdUp ? "BUY" : "SELL";
      }

      // 3. 損切り(SL)・利確(TP)の具体的な値段計算（直近6本の高値・安値ベース）
      const isJpy = pair.endsWith("/JPY");
      const decimals = isJpy ? 3 : 5;
      const pipUnit = isJpy ? 0.01 : 0.0001;
      const buffer = isJpy ? 0.05 : 0.0005; // 直近高値・安値の5pips外側
      const minSlDist = isJpy ? 0.15 : 0.0015; // 最低15pips幅を確保
      const maxSlDist = isJpy ? 0.80 : 0.0080; // 極端に広すぎる場合は80pipsに制限

      const recentSlice = bars.slice(-6);
      const recentLow = Math.min(...recentSlice.map(b => b.low));
      const recentHigh = Math.max(...recentSlice.map(b => b.high));
      const closeNow = closes[last];

      let slPrice = 0;
      let tpPrice = 0;
      let slPips = 0;
      let tpPips = 0;

      if (targetSide === "BUY") {
        let rawSl = recentLow - buffer;
        let dist = closeNow - rawSl;
        if (dist < minSlDist) dist = minSlDist;
        if (dist > maxSlDist) dist = maxSlDist;
        slPrice = closeNow - dist;
        tpPrice = closeNow + dist * rrRatio;
        slPips = Math.round(dist / pipUnit);
        tpPips = Math.round((dist * rrRatio) / pipUnit);
      } else {
        let rawSl = recentHigh + buffer;
        let dist = rawSl - closeNow;
        if (dist < minSlDist) dist = minSlDist;
        if (dist > maxSlDist) dist = maxSlDist;
        slPrice = closeNow + dist;
        tpPrice = closeNow - dist * rrRatio;
        slPips = Math.round(dist / pipUnit);
        tpPips = Math.round((dist * rrRatio) / pipUnit);
      }

      return {
        close: closeNow.toFixed(decimals),
        qqeBuy,
        macdUp,
        macdTurnedUp,
        macdTurnedDown,
        statusType,
        targetSide,
        slPrice: slPrice.toFixed(decimals),
        tpPrice: tpPrice.toFixed(decimals),
        slPips,
        tpPips
      };
    }

    async function fetch1HourBars(pair) {
      const url = `https://api.twelvedata.com/time_series?symbol=${encodeURIComponent(pair)}&interval=1h&outputsize=120&apikey=${encodeURIComponent(apiKey)}`;
      const res = await fetch(url, { cache: "no-store" });
      const data = await res.json();
      if (data.status === "error" || !data.values) {
        throw new Error(data.message || "APIエラー");
      }
      const asc = [...data.values].reverse();
      const lastBar = asc[asc.length - 1];
      return {
        lastTime: lastBar.datetime,
        bars: asc.map(v => ({
          high: parseFloat(v.high),
          low: parseFloat(v.low),
          close: parseFloat(v.close)
        }))
      };
    }

    async function checkAll() {
      const banner = document.getElementById("statusBanner");
      const grid = document.getElementById("cards");
      const btn = document.getElementById("updateBtn");

      if (!apiKey) {
        banner.textContent = "上の入力欄に Twelve Data APIキーを貼り付けて「保存」を押してください";
        return;
      }

      if (isFetching) return;
      isFetching = true;
      if (btn) {
        btn.disabled = true;
        btn.textContent = "取得中...";
      }

      banner.className = "banner";
      banner.textContent = "1時間足 QQE ＋ MACD(5・20・9) を8通貨分計算中...";
      grid.innerHTML = "";

      const fast = Number(document.getElementById("fastParam").value) || 2.618;
      const slow = Number(document.getElementById("slowParam").value) || 4.236;
      const rrRatio = Number(document.getElementById("rrRatio").value) || 1.5;

      const results = [];
      for (const item of PAIRS) {
        try {
          const h1Data = await fetch1HourBars(item.code);
          const analyzed = analyzePair(item.code, h1Data.bars, fast, slow, rrRatio);
          results.push({ ...item, lastTime: h1Data.lastTime, ...analyzed });
        } catch (err) {
          results.push({ ...item, error: err.message || "取得エラー" });
        }
      }

      // 両方一致GO → 初動転換 → 待機中の順に自動並べ替え
      const rank = r => {
        if (r.error) return 0;
        if (r.statusType === "go_buy" || r.statusType === "go_sell") return 30;
        if (r.statusType === "early_buy" || r.statusType === "early_sell") return 20;
        return 10;
      };
      results.sort((a, b) => rank(b) - rank(a));

      const valid = results.find(r => !r.error);
      const hasRateLimit = results.some(r => r.error && r.error.includes("API credits"));
      const timeLabel = valid ? `最新足: ${valid.lastTime}` : "";
      const goList = results.filter(r => !r.error && (r.statusType === "go_buy" || r.statusType === "go_sell"));

      if (hasRateLimit) {
        banner.className = "banner alert";
        banner.textContent = "⏳ 1分間のAPI回数上限に達しました。1分待ってから「更新」を押してください。";
      } else if (goList.length > 0) {
        banner.className = "banner alert";
        banner.innerHTML = `🔥 一致GO: ${goList.map(g => `${g.jp}(${g.targetSide})`).join(" / ")}<br><span class="meta">${timeLabel}</span>`;
      } else {
        banner.innerHTML = `⏳ 現在QQEとMACDが完全一致のGOなし（初動・待機を確認）<br><span class="meta">${timeLabel}</span>`;
      }

      for (const r of results) {
        const card = document.createElement("div");
        if (r.error) {
          const shortErr = r.error.includes("API credits") ? "1分間の制限待機中（1分後に再更新）" : r.error;
          card.className = "card";
          card.innerHTML = `
            <div class="pair-title"><span class="pair-en">${r.code}</span><span class="pair-jp">${r.jp}</span></div>
            <div class="meta">${shortErr}</div>
          `;
        } else {
          let cardClass = "card";
          let pillClass = "status-pill pill-wait";
          let pillText = "⚠️ 勢い一服（利確・様子見）";

          if (r.statusType === "go_buy") {
            cardClass += " go-buy";
            pillClass = "status-pill pill-go-buy";
            pillText = "🔥 BUY（買いGO）";
          } else if (r.statusType === "go_sell") {
            cardClass += " go-sell";
            pillClass = "status-pill pill-go-sell";
            pillText = "🔥 SELL（売りGO）";
          } else if (r.statusType === "early_buy") {
            cardClass += " early";
            pillClass = "status-pill pill-early";
            pillText = "⚡ 初動買い（MACD上転）";
          } else if (r.statusType === "early_sell") {
            cardClass += " early";
            pillClass = "status-pill pill-early";
            pillText = "⚡ 初動売り（MACD下転）";
          }

          card.className = cardClass;
          card.innerHTML = `
            <div>
              <div class="pair-title">
                <span class="pair-en">${r.code}</span>
                <span class="pair-jp">${r.jp}</span>
              </div>
              <div class="${pillClass}">${pillText}</div>
              <div class="ind-box">
                現在値: <strong>${r.close}</strong><br>
                QQE: <span class="${r.qqeBuy ? "up-txt" : "down-txt"}">${r.qqeBuy ? "▲BUY" : "▼SELL"}</span> ／
                MACD: <span class="${r.macdUp ? "up-txt" : "down-txt"}">${r.macdUp ? "↗上向き" : "↘下向き"}</span>
              </div>
            </div>
            <div class="price-targets">
              <div class="target-row">
                <div class="target-info">
                  <span class="target-label tp-label">🎯 利確目安 (+${r.tpPips}p)</span>
                  <span class="target-val">${r.tpPrice}</span>
                </div>
                <button class="copy-btn" onclick="copyPrice(this, '${r.tpPrice}')">コピー</button>
              </div>
              <div class="target-row">
                <div class="target-info">
                  <span class="target-label sl-label">🛑 損切り目安 (-${r.slPips}p)</span>
                  <span class="target-val">${r.slPrice}</span>
                </div>
                <button class="copy-btn" onclick="copyPrice(this, '${r.slPrice}')">コピー</button>
              </div>
            </div>
          `;
        }
        grid.appendChild(card);
      }

      isFetching = false;
      startCooldown(62);
    }

    if (apiKey) {
      checkAll();
    }
  </script>
</body>
</html>
