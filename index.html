<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>日足 QQE + 200EMA監視 (厳選7通貨)</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --card-sub: #0f172a;
      --border: #334155;
      --text: #f8fafc;
      --muted: #94a3b8;
      --buy: #10b981;
      --sell: #ef4444;
      --accent: #38bdf8;
      --warn: #facc15;
      --hot: #f97316;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 10px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    .container { max-width: 980px; margin: 0 auto; }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 6px;
      margin-bottom: 10px;
    }
    h1 { font-size: 1rem; margin: 0; }
    h2 { font-size: 0.96rem; margin: 20px 0 8px; border-left: 4px solid var(--accent); padding-left: 8px; }
    .header-btns { display: flex; gap: 6px; align-items: center; }
    .controls {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-bottom: 10px;
      align-items: center;
    }
    select, button {
      background: var(--card);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 7px;
      padding: 6px 8px;
      font-size: 0.78rem;
    }
    button { cursor: pointer; font-weight: 600; }
    button.primary { background: var(--accent); color: #0f172a; border: none; padding: 7px 12px; }
    button.reset-btn {
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.45);
      color: #fca5a5;
      font-size: 0.74rem;
      padding: 6px 9px;
    }
    button.buy-btn {
      background: rgba(16, 185, 129, 0.22);
      border-color: var(--buy);
      color: #34d399;
      width: 100%;
      margin-top: 5px;
      padding: 6px 4px;
      font-size: 0.76rem;
    }
    button.sell-btn {
      background: rgba(239, 68, 68, 0.22);
      border-color: var(--sell);
      color: #f87171;
      width: 100%;
      margin-top: 5px;
      padding: 6px 4px;
      font-size: 0.76rem;
    }
    button.counter-btn {
      background: transparent;
      border: 1px dashed var(--border);
      color: var(--muted);
      width: 100%;
      margin-top: 4px;
      padding: 3px 4px;
      font-size: 0.68rem;
      font-weight: 500;
      border-radius: 5px;
    }
    button.counter-btn:hover {
      border-color: #64748b;
      color: #cbd5e1;
      background: rgba(148, 163, 184, 0.08);
    }
    button.doten-btn {
      background: var(--warn);
      color: #0f172a;
      border: none;
      width: 100%;
      margin-top: 5px;
      padding: 6px 4px;
      font-size: 0.74rem;
      font-weight: 800;
    }
    button.close-btn {
      background: #334155;
      color: #f8fafc;
      border: none;
      width: 100%;
      margin-top: 4px;
      padding: 5px 4px;
      font-size: 0.72rem;
    }
    button:active { opacity: 0.85; }

    .banner {
      padding: 9px 10px;
      border-radius: 8px;
      margin-bottom: 10px;
      font-weight: bold;
      text-align: center;
      background: var(--card);
      border: 1px solid var(--border);
      font-size: 0.82rem;
      line-height: 1.45;
    }
    .banner.alert {
      background: rgba(250, 204, 21, 0.15);
      border-color: var(--warn);
      color: #fef08a;
    }

    /* スマホでも横2列、タブレット・PCで横3〜4列 */
    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
    }
    @media (min-width: 720px) {
      .grid {
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 10px;
      }
    }
    @media (min-width: 940px) {
      .grid {
        grid-template-columns: repeat(4, minmax(0, 1fr));
      }
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 9px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-width: 0;
    }
    .card.hot {
      border: 2px solid var(--hot);
      box-shadow: 0 0 12px rgba(249, 115, 22, 0.28);
    }
    .card.flipped {
      border: 2px solid var(--warn);
      box-shadow: 0 0 12px rgba(250, 204, 21, 0.22);
    }

    .pair-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 4px;
      margin-bottom: 4px;
    }
    .pair-title {
      display: flex;
      flex-direction: column;
      line-height: 1.2;
    }
    .pair-en {
      font-size: 0.92rem;
      font-weight: 800;
      letter-spacing: 0.01em;
    }
    .pair-jp {
      font-size: 0.72rem;
      color: #cbd5e1;
      font-weight: 600;
      margin-top: 1px;
    }
    .del-btn {
      background: transparent;
      border: none;
      color: var(--muted);
      padding: 0 3px;
      font-size: 0.75rem;
      line-height: 1;
    }

    .tags-row {
      display: flex;
      flex-wrap: wrap;
      gap: 3px;
      margin-bottom: 5px;
    }
    .badge {
      display: inline-block;
      padding: 2px 6px;
      border-radius: 999px;
      font-size: 0.7rem;
      font-weight: 700;
    }
    .badge.buy { background: rgba(16, 185, 129, 0.2); color: #34d399; }
    .badge.sell { background: rgba(239, 68, 68, 0.2); color: #f87171; }
    .flip-tag {
      display: inline-block;
      background: var(--warn);
      color: #0f172a;
      font-size: 0.65rem;
      font-weight: 800;
      padding: 2px 5px;
      border-radius: 4px;
    }
    .hot-tag {
      display: inline-block;
      background: var(--hot);
      color: #ffffff;
      font-size: 0.65rem;
      font-weight: 800;
      padding: 2px 5px;
      border-radius: 4px;
    }
    .counter-tag {
      display: inline-block;
      background: rgba(148, 163, 184, 0.2);
      color: #cbd5e1;
      font-size: 0.64rem;
      padding: 1px 4px;
      border-radius: 4px;
      margin-left: 3px;
    }

    .ema-box {
      font-size: 0.69rem;
      padding: 4px 6px;
      border-radius: 5px;
      margin-bottom: 6px;
      font-weight: 600;
      line-height: 1.3;
    }
    .ema-aligned {
      background: rgba(249, 115, 22, 0.16);
      border: 1px solid rgba(249, 115, 22, 0.45);
      color: #fdba74;
    }
    .ema-counter {
      background: rgba(148, 163, 184, 0.12);
      border: 1px solid rgba(148, 163, 184, 0.25);
      color: #94a3b8;
    }

    .lines {
      background: var(--card-sub);
      border-radius: 6px;
      padding: 5px 7px;
      font-size: 0.71rem;
      margin-bottom: 5px;
      line-height: 1.45;
    }
    .pos-box {
      background: rgba(56, 189, 248, 0.1);
      border: 1px solid rgba(56, 189, 248, 0.35);
      border-radius: 6px;
      padding: 6px;
      margin-top: 5px;
      font-size: 0.71rem;
      line-height: 1.4;
    }
    .plus { color: #34d399; font-weight: 700; }
    .minus { color: #f87171; font-weight: 700; }
    .meta { font-size: 0.68rem; color: var(--muted); }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      margin-bottom: 10px;
    }
    @media (max-width: 520px) {
      .stats-grid { grid-template-columns: repeat(2, 1fr); }
    }
    .stat-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px;
      text-align: center;
    }
    .stat-label { font-size: 0.7rem; color: var(--muted); }
    .stat-val { font-size: 1rem; font-weight: 800; margin-top: 2px; }

    .history-wrap {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow-x: auto;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.76rem;
      min-width: 500px;
    }
    th, td {
      padding: 7px 8px;
      border-bottom: 1px solid var(--border);
      text-align: left;
    }
    th { color: var(--muted); font-weight: 600; background: rgba(15, 23, 42, 0.5); }

    .settings {
      margin-top: 16px;
      padding: 10px;
      background: var(--card);
      border-radius: 8px;
      font-size: 0.75rem;
      color: var(--muted);
    }
    .settings input {
      background: var(--card-sub);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 5px;
      width: 58px;
      padding: 3px 5px;
      margin: 3px 5px 3px 2px;
      font-size: 0.75rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>📊 日足 QQE + 200EMA (7通貨)</h1>
      <div class="header-btns">
        <button class="reset-btn" onclick="resetAllRecords()">記録リセット</button>
        <button class="primary" onclick="checkAll()">更新</button>
      </div>
    </header>

    <div id="statusBanner" class="banner">日足データを取得中...</div>

    <div class="controls">
      <span class="meta">流動性トップ7通貨固定</span>
      <span class="meta" style="margin-left: auto;">基本ロット:</span>
      <select id="lotSelect" onchange="saveLot()">
        <option value="1000" selected>1,000通貨</option>
        <option value="2000">2,000通貨</option>
        <option value="3000">3,000通貨</option>
        <option value="5000">5,000通貨</option>
        <option value="10000">10,000通貨</option>
      </select>
    </div>

    <div id="cards" class="grid"></div>

    <h2>🏆 トレード成績 & 履歴</h2>
    <div id="statsGrid" class="stats-grid"></div>

    <div class="history-wrap">
      <table>
        <thead>
          <tr>
            <th>通貨</th>
            <th>売買</th>
            <th>エントリー</th>
            <th>決済</th>
            <th>獲得pips</th>
            <th>損益(目安)</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="historyBody"></tbody>
      </table>
    </div>

    <div class="settings">
      <strong>Glaz QQE 設定:</strong>
      Fast <input id="fastParam" type="number" step="0.0001" value="2.6180" />
      Slow <input id="slowParam" type="number" step="0.0001" value="4.2360" />
      RSI <input id="rsiParam" type="number" value="14" />
      SF <input id="sfParam" type="number" value="2" />
      <button onclick="checkAll()">再計算</button>
    </div>
  </div>

  <script>
    // 流動性トップ7通貨ペアに固定
    const PAIRS = [
      "EUR/USD",
      "USD/JPY",
      "GBP/USD",
      "EUR/JPY",
      "GBP/JPY",
      "AUD/USD",
      "AUD/JPY"
    ];

    const CURRENCY_JP = {
      USD: "ドル",
      JPY: "円",
      EUR: "ユーロ",
      GBP: "ポンド",
      AUD: "豪ドル",
      NZD: "NZドル",
      CAD: "カナダドル",
      CHF: "スイス"
    };

    function getPairJpName(pair) {
      const [base, quote] = pair.split("/");
      const bJp = CURRENCY_JP[base] || base;
      const qJp = CURRENCY_JP[quote] || quote;
      return `${bJp}/${qJp}`;
    }

    let positions = JSON.parse(localStorage.getItem("qqe_positions")) || {};
    let history = JSON.parse(localStorage.getItem("qqe_history")) || [];
    let defaultLot = Number(localStorage.getItem("qqe_lot")) || 1000;
    document.getElementById("lotSelect").value = String(defaultLot);

    let latestRates = {};

    // 保有中ポジション・トレード履歴・旧通貨リストをすべて一括初期化
    function resetAllRecords() {
      if (!confirm("保有中のポジションとトレード履歴をすべてリセット（全消去）しますか？")) return;
      positions = {};
      history = [];
      localStorage.removeItem("qqe_positions");
      localStorage.removeItem("qqe_history");
      localStorage.removeItem("qqe_glaz_pairs_v3");
      localStorage.removeItem("qqe_glaz_pairs_7_v1");
      checkAll();
    }

    function saveLot() {
      defaultLot = Number(document.getElementById("lotSelect").value) || 1000;
      localStorage.setItem("qqe_lot", String(defaultLot));
    }

    function saveTradeData() {
      localStorage.setItem("qqe_positions", JSON.stringify(positions));
      localStorage.setItem("qqe_history", JSON.stringify(history));
    }

    function getTodayStr() {
      const now = new Date();
      const y = now.getFullYear();
      const m = String(now.getMonth() + 1).padStart(2, "0");
      const d = String(now.getDate()).padStart(2, "0");
      return `${y}-${m}-${d}`;
    }

    function calcPnL(pair, side, entryPrice, exitPrice, lot) {
      const isJpyQuote = pair.endsWith("/JPY");
      const pipUnit = isJpyQuote ? 0.01 : 0.0001;
      const diff = side === "BUY" ? (exitPrice - entryPrice) : (entryPrice - exitPrice);
      const pips = diff / pipUnit;

      let jpyRate = 1;
      if (!isJpyQuote) {
        const quote = pair.split("/")[1];
        const quoteJpyPair = `${quote}/JPY`;
        if (latestRates[quoteJpyPair]) {
          jpyRate = latestRates[quoteJpyPair].close;
        } else if (quote === "USD") {
          jpyRate = 153;
        } else if (quote === "AUD") {
          jpyRate = 100;
        }
      }
      const profitJpy = Math.round(diff * lot * jpyRate);
      return { pips: Number(pips.toFixed(1)), profitJpy };
    }

    function openPosition(pair, side, isCounter = false) {
      const jp = getPairJpName(pair);
      const suggested = latestRates[pair] ? latestRates[pair].close : "";
      const modeLabel = isCounter ? "【逆張り】" : "";
      const input = prompt(`${modeLabel}${pair}（${jp}）の ${side} エントリー価格を入力してください:`, suggested);
      if (input === null) return;
      const price = parseFloat(input);
      if (isNaN(price) || price <= 0) {
        alert("正しい価格を入力してください");
        return;
      }
      positions[pair] = {
        side,
        entryPrice: price,
        entryDate: getTodayStr(),
        lot: defaultLot,
        isCounter
      };
      saveTradeData();
      checkAll();
    }

    function closePosition(pair) {
      const pos = positions[pair];
      if (!pos) return;
      const jp = getPairJpName(pair);
      const suggested = latestRates[pair] ? latestRates[pair].close : pos.entryPrice;
      const input = prompt(`${pair}（${jp} / ${pos.side} @ ${pos.entryPrice}）の決済価格を入力してください:`, suggested);
      if (input === null) return;
      const exitPrice = parseFloat(input);
      if (isNaN(exitPrice) || exitPrice <= 0) {
        alert("正しい価格を入力してください");
        return;
      }
      const { pips, profitJpy } = calcPnL(pair, pos.side, pos.entryPrice, exitPrice, pos.lot);
      history.unshift({
        id: Date.now(),
        pair,
        side: pos.side,
        entryPrice: pos.entryPrice,
        entryDate: pos.entryDate,
        exitPrice,
        exitDate: getTodayStr(),
        pips,
        profitJpy,
        lot: pos.lot,
        isCounter: Boolean(pos.isCounter)
      });
      delete positions[pair];
      saveTradeData();
      checkAll();
    }

    function dotenPosition(pair, newSide) {
      const pos = positions[pair];
      if (!pos) return openPosition(pair, newSide, false);
      const jp = getPairJpName(pair);
      const suggested = latestRates[pair] ? latestRates[pair].close : pos.entryPrice;
      const input = prompt(
        `【ドテン実行】${pair}（${jp}）\n現在の ${pos.side} (${pos.entryPrice}) を決済し、新しく ${newSide} を入れます。\n約定価格を入力してください:`,
        suggested
      );
      if (input === null) return;
      const price = parseFloat(input);
      if (isNaN(price) || price <= 0) {
        alert("正しい価格を入力してください");
        return;
      }
      const { pips, profitJpy } = calcPnL(pair, pos.side, pos.entryPrice, price, pos.lot);
      const today = getTodayStr();
      history.unshift({
        id: Date.now(),
        pair,
        side: pos.side,
        entryPrice: pos.entryPrice,
        entryDate: pos.entryDate,
        exitPrice: price,
        exitDate: today,
        pips,
        profitJpy,
        lot: pos.lot,
        isCounter: Boolean(pos.isCounter)
      });
      positions[pair] = {
        side: newSide,
        entryPrice: price,
        entryDate: today,
        lot: defaultLot,
        isCounter: false
      };
      saveTradeData();
      checkAll();
    }

    function deleteHistory(id) {
      if (!confirm("このトレード履歴を1件削除しますか？")) return;
      history = history.filter(h => h.id !== id);
      saveTradeData();
      renderHistory();
    }

    function renderHistory() {
      const statsGrid = document.getElementById("statsGrid");
      const tbody = document.getElementById("historyBody");

      const totalTrades = history.length;
      const wins = history.filter(h => h.pips > 0).length;
      const winRate = totalTrades > 0 ? ((wins / totalTrades) * 100).toFixed(1) : "0.0";
      const totalPips = history.reduce((acc, h) => acc + h.pips, 0).toFixed(1);
      const totalProfit = history.reduce((acc, h) => acc + h.profitJpy, 0);

      const pipsClass = Number(totalPips) >= 0 ? "plus" : "minus";
      const profitClass = totalProfit >= 0 ? "plus" : "minus";

      statsGrid.innerHTML = `
        <div class="stat-card">
          <div class="stat-label">決済回数</div>
          <div class="stat-val">${totalTrades}回</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">勝率</div>
          <div class="stat-val">${winRate}%</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">累計pips</div>
          <div class="stat-val ${pipsClass}">${Number(totalPips) >= 0 ? "+" : ""}${totalPips}</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">累計損益(目安)</div>
          <div class="stat-val ${profitClass}">${totalProfit >= 0 ? "+" : ""}${totalProfit.toLocaleString()}円</div>
        </div>
      `;

      if (history.length === 0) {
        tbody.innerHTML = `<tr><td colspan="7" style="text-align:center; color: var(--muted); padding: 14px;">まだ決済済みの記録はありません。</td></tr>`;
        return;
      }

      tbody.innerHTML = history.map(h => {
        const isWin = h.pips >= 0;
        const jp = getPairJpName(h.pair);
        return `
          <tr>
            <td><strong>${h.pair}</strong> <span class="meta">${jp}</span><br><span class="meta">${h.lot.toLocaleString()}通貨</span></td>
            <td>
              <span class="badge ${h.side === "BUY" ? "buy" : "sell"}">${h.side}</span>
              ${h.isCounter ? '<span class="counter-tag">逆張り</span>' : ""}
            </td>
            <td>${h.entryDate}<br><strong>${h.entryPrice}</strong></td>
            <td>${h.exitDate}<br><strong>${h.exitPrice}</strong></td>
            <td class="${isWin ? "plus" : "minus"}">${isWin ? "+" : ""}${h.pips} pips</td>
            <td class="${isWin ? "plus" : "minus"}">${isWin ? "+" : ""}${h.profitJpy.toLocaleString()}円</td>
            <td><button class="del-btn" onclick="deleteHistory(${h.id})">✕</button></td>
          </tr>
        `;
      }).join("");
    }

    function pineRsi(closes, length) {
      const n = closes.length;
      const rsi = new Array(n).fill(50);
      if (n <= length) return rsi;
      let gainSum = 0, lossSum = 0;
      for (let i = 1; i <= length; i++) {
        const diff = closes[i] - closes[i - 1];
        if (diff > 0) gainSum += diff;
        else lossSum -= diff;
      }
      let avgGain = gainSum / length;
      let avgLoss = lossSum / length;
      rsi[length] = avgLoss === 0 ? 100 : 100 - (100 / (1 + avgGain / avgLoss));
      for (let i = length + 1; i < n; i++) {
        const diff = closes[i] - closes[i - 1];
        const g = diff > 0 ? diff : 0;
        const l = diff < 0 ? -diff : 0;
        avgGain = (avgGain * (length - 1) + g) / length;
        avgLoss = (avgLoss * (length - 1) + l) / length;
        rsi[i] = avgLoss === 0 ? 100 : 100 - (100 / (1 + avgGain / avgLoss));
      }
      return rsi;
    }

    function pineEma(values, length) {
      const k = 2 / (length + 1);
      const out = [values[0]];
      for (let i = 1; i < values.length; i++) {
        out.push(values[i] * k + out[i - 1] * (1 - k));
      }
      return out;
    }

    function wima(values, length) {
      const out = new Array(values.length).fill(0);
      out[0] = values[0] / length;
      for (let i = 1; i < values.length; i++) {
        out[i] = (values[i] + out[i - 1] * (length - 1)) / length;
      }
      return out;
    }

    function calcGlazQQE(closes, fast = 2.618, slow = 4.236, rsiLen = 14, sf = 2) {
      const n = closes.length;
      const rawRsi = pineRsi(closes, rsiLen);
      const rsIndex = pineEma(rawRsi, sf);
      const tr = new Array(n).fill(0);
      for (let i = 1; i < n; i++) {
        const th = rsIndex[i - 1] > rsIndex[i] ? rsIndex[i - 1] : rsIndex[i];
        const tl = rsIndex[i - 1] < rsIndex[i] ? rsIndex[i - 1] : rsIndex[i];
        tr[i] = th - tl;
      }
      const atrRsi = wima(tr, 14);
      const smoothedAtrRsi = wima(atrRsi, 14);
      const deltaFast = smoothedAtrRsi.map(v => v * fast);
      const deltaSlow = smoothedAtrRsi.map(v => v * slow);

      const longband = new Array(n).fill(0), shortband = new Array(n).fill(0), trend = new Array(n).fill(1), fastTL = new Array(n).fill(0);
      const longband1 = new Array(n).fill(0), shortband1 = new Array(n).fill(0), trend1 = new Array(n).fill(1), slowTL = new Array(n).fill(0);

      for (let i = 1; i < n; i++) {
        const newShort = rsIndex[i] + deltaFast[i];
        const newLong = rsIndex[i] - deltaFast[i];
        longband[i] = (rsIndex[i - 1] > longband[i - 1] && rsIndex[i] > longband[i - 1]) ? Math.max(longband[i - 1], newLong) : newLong;
        shortband[i] = (rsIndex[i - 1] < shortband[i - 1] && rsIndex[i] < shortband[i - 1]) ? Math.min(shortband[i - 1], newShort) : newShort;
        const crossUpFast = rsIndex[i - 1] <= shortband[i - 1] && rsIndex[i] > shortband[i - 1];
        const crossDownFast = longband[i - 1] <= rsIndex[i - 1] && longband[i - 1] > rsIndex[i];
        trend[i] = crossUpFast ? 1 : (crossDownFast ? -1 : trend[i - 1]);
        fastTL[i] = trend[i] === 1 ? longband[i] : shortband[i];

        const newShort1 = rsIndex[i] + deltaSlow[i];
        const newLong1 = rsIndex[i] - deltaSlow[i];
        longband1[i] = (rsIndex[i - 1] > longband1[i - 1] && rsIndex[i] > longband1[i - 1]) ? Math.max(longband1[i - 1], newLong1) : newLong1;
        shortband1[i] = (rsIndex[i - 1] < shortband1[i - 1] && rsIndex[i] < shortband1[i - 1]) ? Math.min(shortband1[i - 1], newShort1) : newShort1;
        const crossUpSlow = rsIndex[i - 1] <= shortband1[i - 1] && rsIndex[i] > shortband1[i - 1];
        const crossDownSlow = longband1[i - 1] <= rsIndex[i - 1] && longband1[i - 1] > rsIndex[i];
        trend1[i] = crossUpSlow ? 1 : (crossDownSlow ? -1 : trend1[i - 1]);
        slowTL[i] = trend1[i] === 1 ? longband1[i] : shortband1[i];
      }

      const ema200Arr = pineEma(closes, 200);
      const last = n - 1, prev = n - 2;
      const closeNow = closes[last];
      const ema200Now = ema200Arr[last];
      const ema200Prev = ema200Arr[prev];

      const isBuyNow = fastTL[last] > slowTL[last];
      const wasBuyPrev = fastTL[prev] > slowTL[prev];

      const aboveEma = closeNow > ema200Now;
      const emaRising = ema200Now >= ema200Prev;
      const isStrongAligned = (isBuyNow && aboveEma && emaRising) || (!isBuyNow && !aboveEma && !emaRising);
      const isBasicAligned = (isBuyNow && aboveEma) || (!isBuyNow && !aboveEma);

      const decimals = closeNow > 20 ? 2 : 4;

      return {
        isBuy: isBuyNow,
        flipped: isBuyNow !== wasBuyPrev,
        greenFast: fastTL[last].toFixed(2),
        redSlow: slowTL[last].toFixed(2),
        close: closeNow,
        ema200: ema200Now.toFixed(decimals),
        aboveEma,
        emaRising,
        isStrongAligned,
        isBasicAligned
      };
    }

    async function fetchDailyCloses(base, quote) {
      const end = new Date(Date.now() + 9 * 60 * 60 * 1000 + 24 * 60 * 60 * 1000);
      const start = new Date(end.getTime() - 335 * 24 * 60 * 60 * 1000);
      const fmt = d => d.toISOString().split("T")[0];
      const url = `https://api.frankfurter.dev/v1/${fmt(start)}..${fmt(end)}?base=${base}&symbols=${quote}&_=${Date.now()}`;
      const res = await fetch(url, { cache: "no-store" });
      if (!res.ok) throw new Error("取得失敗");
      const data = await res.json();
      const dates = Object.keys(data.rates).sort();
      return {
        dates,
        closes: dates.map(d => data.rates[d][quote])
      };
    }

    async function checkAll() {
      const banner = document.getElementById("statusBanner");
      const grid = document.getElementById("cards");
      banner.className = "banner";
      banner.textContent = "7通貨の最新日足・200EMAを取得中...";
      grid.innerHTML = "";

      const fast = Number(document.getElementById("fastParam").value) || 2.618;
      const slow = Number(document.getElementById("slowParam").value) || 4.236;
      const rsiLen = Number(document.getElementById("rsiParam").value) || 14;
      const sf = Number(document.getElementById("sfParam").value) || 2;

      const results = await Promise.all(PAIRS.map(async (pair) => {
        const [base, quote] = pair.split("/");
        try {
          const { dates, closes } = await fetchDailyCloses(base, quote);
          const qqe = calcGlazQQE(closes, fast, slow, rsiLen, sf);
          const lastDate = dates[dates.length - 1];
          latestRates[pair] = { close: qqe.close, date: lastDate };
          return { pair, jpName: getPairJpName(pair), lastDate, ...qqe };
        } catch (err) {
          return { pair, jpName: getPairJpName(pair), error: true };
        }
      }));

      results.sort((a, b) => {
        if (a.error) return 1;
        if (b.error) return -1;
        const aDoten = positions[a.pair] && ((positions[a.pair].side === "BUY") !== a.isBuy) && !positions[a.pair].isCounter ? 100 : 0;
        const bDoten = positions[b.pair] && ((positions[b.pair].side === "BUY") !== b.isBuy) && !positions[b.pair].isCounter ? 100 : 0;
        const aScore = aDoten + (a.flipped ? 20 : 0) + (a.isStrongAligned ? 10 : (a.isBasicAligned ? 5 : 0));
        const bScore = bDoten + (b.flipped ? 20 : 0) + (b.isStrongAligned ? 10 : (b.isBasicAligned ? 5 : 0));
        return bScore - aScore;
      });

      const validResult = results.find(r => !r.error);
      const dataDateLabel = validResult ? `最新確定足: ${validResult.lastDate}` : "";

      const flippedPairs = results.filter(r => !r.error && r.flipped);
      const hotPairs = results.filter(r => !r.error && r.isStrongAligned);

      if (flippedPairs.length > 0) {
        banner.className = "banner alert";
        banner.innerHTML = `🔔 転換: ${flippedPairs.map(p => `${p.pair}(${p.jpName})`).join(" / ")}<br><span class="meta">🔥 200EMA順張り: ${hotPairs.length}通貨 (${dataDateLabel})</span>`;
      } else {
        banner.innerHTML = `✅ 新規転換なし ／ 🔥 200EMA順張り: ${hotPairs.length}通貨<br><span class="meta">${dataDateLabel}</span>`;
      }

      for (const r of results) {
        const card = document.createElement("div");
        const pos = positions[r.pair];
        const currentSignalSide = r.isBuy ? "BUY" : "SELL";
        const counterSignalSide = r.isBuy ? "SELL" : "BUY";
        const isDotenTime = pos && !pos.isCounter && pos.side !== currentSignalSide;

        let cardClass = "card";
        if (r.flipped || isDotenTime) cardClass += " flipped";
        else if (r.isStrongAligned) cardClass += " hot";
        card.className = cardClass;

        if (r.error) {
          card.innerHTML = `
            <div class="pair-row">
              <div class="pair-title">
                <span class="pair-en">${r.pair}</span>
                <span class="pair-jp">${r.jpName}</span>
              </div>
            </div>
            <div class="meta">取得エラー</div>
          `;
        } else {
          let positionHtml = "";
          if (pos) {
            const pnl = calcPnL(r.pair, pos.side, pos.entryPrice, r.close, pos.lot);
            const isPlus = pnl.pips >= 0;
            positionHtml = `
              <div class="pos-box">
                <div>
                  <strong>保有: ${pos.side}</strong>
                  ${pos.isCounter ? '<span class="counter-tag">逆張り</span>' : ""}
                </div>
                <div class="meta">${pos.entryPrice} (${pos.lot.toLocaleString()})</div>
                <div>損益: <span class="${isPlus ? "plus" : "minus"}">${isPlus ? "+" : ""}${pnl.pips}p (${isPlus ? "+" : ""}${pnl.profitJpy.toLocaleString()}円)</span></div>
                ${isDotenTime
                  ? `<button class="doten-btn" onclick="dotenPosition('${r.pair}', '${currentSignalSide}')">🔄 ドテン${currentSignalSide}</button>`
                  : `<button class="close-btn" onclick="closePosition('${r.pair}')">決済記録</button>`
                }
              </div>
            `;
          } else {
            positionHtml = `
              <div>
                <button class="${r.isBuy ? "buy-btn" : "sell-btn"}" onclick="openPosition('${r.pair}', '${currentSignalSide}', false)">
                  📥 ${currentSignalSide} 記録
                </button>
                <button class="counter-btn" onclick="openPosition('${r.pair}', '${counterSignalSide}', true)">
                  ↩ 逆張り${counterSignalSide}
                </button>
              </div>
            `;
          }

          const emaStatusText = r.isStrongAligned
            ? `🔥 要チェック！200EMA順張り`
            : r.isBasicAligned
              ? `👍 200EMA同方向`
              : `⚠️ 200EMAと逆向き`;

          card.innerHTML = `
            <div>
              <div class="pair-row">
                <div class="pair-title">
                  <span class="pair-en">${r.pair}</span>
                  <span class="pair-jp">${r.jpName}</span>
                </div>
              </div>
              <div class="tags-row">
                <span class="badge ${r.isBuy ? "buy" : "sell"}">
                  ${r.isBuy ? "▲ BUY" : "▼ SELL"}
                </span>
                ${r.flipped ? '<span class="flip-tag">転換</span>' : ""}
                ${r.isStrongAligned ? '<span class="hot-tag">🔥要チェック</span>' : ""}
              </div>
              <div class="ema-box ${r.isBasicAligned ? "ema-aligned" : "ema-counter"}">
                ${emaStatusText}
              </div>
              <div class="lines">
                🟢${r.greenFast} / 🔴${r.redSlow}<br>
                終値: <strong>${r.close}</strong><br>
                200EMA: <strong>${r.ema200}</strong>
              </div>
            </div>
            ${positionHtml}
          `;
        }
        grid.appendChild(card);
      }

      renderHistory();
    }

    checkAll();
  </script>
