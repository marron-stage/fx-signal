<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>1時間足 QQE シグナル + 損切り目安 (8通貨)</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --card-sub: #0f172a;
      --border: #334155;
      --text: #f8fafc;
      --muted: #94a3b8;
      --buy: #10b981;
      --sell: #ef4444;
      --accent: #38bdf8;
      --warn: #facc15;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 12px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    .container { max-width: 920px; margin: 0 auto; }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 6px;
      margin-bottom: 10px;
      flex-wrap: wrap;
    }
    h1 { font-size: 1.02rem; margin: 0; }
    .header-btns { display: flex; gap: 6px; align-items: center; }
    .nav-link {
      background: #334155;
      color: #e2e8f0;
      text-decoration: none;
      padding: 6px 9px;
      border-radius: 7px;
      font-size: 0.75rem;
      font-weight: 600;
    }
    .api-bar {
      display: flex;
      gap: 6px;
      align-items: center;
      background: var(--card);
      border: 1px solid var(--border);
      padding: 7px 9px;
      border-radius: 8px;
      margin-bottom: 10px;
      flex-wrap: wrap;
    }
    .api-bar input {
      flex: 1;
      min-width: 140px;
      background: var(--card-sub);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 5px 8px;
      font-size: 0.78rem;
    }
    button {
      background: var(--card);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 7px;
      padding: 6px 10px;
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
    }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    button.primary { background: var(--accent); color: #0f172a; border: none; padding: 6px 14px; }
    button:active { opacity: 0.85; }

    .banner {
      padding: 10px;
      border-radius: 8px;
      margin-bottom: 12px;
      font-weight: 700;
      text-align: center;
      background: var(--card);
      border: 1px solid var(--border);
      font-size: 0.84rem;
      line-height: 1.45;
    }
    .banner.alert {
      background: rgba(250, 204, 21, 0.16);
      border-color: var(--warn);
      color: #fef08a;
    }
    .meta { font-size: 0.7rem; color: var(--muted); font-weight: 400; }

    /* スマホ横2列・PC横4列 */
    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 9px;
    }
    @media (min-width: 720px) {
      .grid { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 11px; }
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-width: 0;
    }
    .card.buy-card {
      border-color: rgba(16, 185, 129, 0.45);
      background: linear-gradient(180deg, rgba(16, 185, 129, 0.08) 0%, var(--card) 100%);
    }
    .card.sell-card {
      border-color: rgba(239, 68, 68, 0.45);
      background: linear-gradient(180deg, rgba(239, 68, 68, 0.08) 0%, var(--card) 100%);
    }
    .card.flipped {
      border: 2px solid var(--warn);
      box-shadow: 0 0 12px rgba(250, 204, 21, 0.28);
    }

    .pair-title {
      display: flex;
      flex-direction: column;
      line-height: 1.2;
      margin-bottom: 6px;
    }
    .pair-en { font-size: 0.96rem; font-weight: 800; }
    .pair-jp { font-size: 0.73rem; color: #cbd5e1; font-weight: 600; margin-top: 1px; }

    .flip-tag {
      display: inline-block;
      background: var(--warn);
      color: #0f172a;
      font-size: 0.67rem;
      font-weight: 800;
      padding: 2px 6px;
      border-radius: 4px;
      margin-bottom: 6px;
      width: fit-content;
    }

    .signal-box {
      text-align: center;
      padding: 8px 6px;
      border-radius: 7px;
      font-size: 0.92rem;
      font-weight: 900;
      margin-bottom: 7px;
      letter-spacing: 0.02em;
    }
    .signal-buy {
      background: rgba(16, 185, 129, 0.22);
      color: #34d399;
      border: 1px solid rgba(16, 185, 129, 0.5);
    }
    .signal-sell {
      background: rgba(239, 68, 68, 0.22);
      color: #f87171;
      border: 1px solid rgba(239, 68, 68, 0.5);
    }

    .rates-box {
      background: var(--card-sub);
      border-radius: 6px;
      padding: 5px 7px;
      font-size: 0.71rem;
      line-height: 1.45;
      color: #cbd5e1;
      margin-bottom: 6px;
    }

    .sl-row {
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.35);
      border-radius: 6px;
      padding: 6px 7px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 4px;
    }
    .sl-info {
      display: flex;
      flex-direction: column;
      line-height: 1.25;
      min-width: 0;
    }
    .sl-label {
      font-size: 0.64rem;
      font-weight: 700;
      color: #fca5a5;
    }
    .sl-val {
      font-size: 0.86rem;
      font-weight: 800;
      color: #f8fafc;
      font-variant-numeric: tabular-nums;
    }
    .copy-btn {
      background: #334155;
      color: #f8fafc;
      border: none;
      border-radius: 5px;
      padding: 6px 8px;
      font-size: 0.68rem;
      font-weight: 700;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .copy-btn.copied {
      background: #10b981;
      color: #0f172a;
    }

    .settings {
      margin-top: 16px;
      padding: 10px;
      background: var(--card);
      border-radius: 8px;
      font-size: 0.74rem;
      color: var(--muted);
      line-height: 1.55;
    }
    .settings input {
      background: var(--card-sub);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 5px;
      width: 58px;
      padding: 3px 5px;
      margin: 3px 5px 3px 2px;
      font-size: 0.74rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>⏱ 1時間足 QQE シグナル (8通貨)</h1>
      <div class="header-btns">
        <a href="./index.html" class="nav-link">📊 日足へ</a>
        <button id="updateBtn" class="primary" onclick="checkAll()">更新</button>
      </div>
    </header>

    <div class="api-bar">
      <span class="meta">APIキー:</span>
      <input id="apiKeyInput" type="password" placeholder="Twelve Data APIキーを貼り付けて保存" />
      <button onclick="saveApiKey()">保存</button>
      <span id="apiStatus" class="meta"></span>
    </div>

    <div id="statusBanner" class="banner">APIキーを保存して「更新」を押してください</div>

    <div id="cards" class="grid"></div>

    <div class="settings">
      <strong>Glaz QQE 設定:</strong>
      Fast <input id="fastParam" type="number" step="0.0001" value="2.6180" />
      Slow <input id="slowParam" type="number" step="0.0001" value="4.2360" />
      RSI <input id="rsiParam" type="number" value="14" />
      SF <input id="sfParam" type="number" value="2" />
      <button onclick="checkAll()">再計算</button>
      <div style="margin-top: 5px;">
        ・<strong>利確：</strong>次の反対シグナル（🔄転換）が出たときに決済＆ドテン<br>
        ・<strong>損切り：</strong>エントリーと同時に上の「🛑損切り目安」をコピーして逆指値にセット（直近6時間の安値/高値の5pips外側）
      </div>
    </div>
  </div>

  <script>
    const PAIRS = [
      { code: "EUR/USD", jp: "ユーロ/ドル" },
      { code: "USD/JPY", jp: "ドル/円" },
      { code: "GBP/USD", jp: "ポンド/ドル" },
      { code: "EUR/JPY", jp: "ユーロ/円" },
      { code: "GBP/JPY", jp: "ポンド/円" },
      { code: "AUD/USD", jp: "豪ドル/ドル" },
      { code: "AUD/JPY", jp: "豪ドル/円" },
      { code: "GBP/AUD", jp: "ポンド/豪ドル" }
    ];

    let apiKey = localStorage.getItem("twelvedata_api_key") || "";
    if (apiKey) {
      document.getElementById("apiKeyInput").value = apiKey;
      document.getElementById("apiStatus").textContent = "✅ 保存済";
    }

    let isFetching = false;
    let cooldownTimer = null;

    function startCooldown(seconds = 62) {
      const btn = document.getElementById("updateBtn");
      if (!btn) return;
      if (cooldownTimer) clearInterval(cooldownTimer);
      let rem = seconds;
      btn.disabled = true;
      btn.textContent = `待機 ${rem}s`;
      cooldownTimer = setInterval(() => {
        rem -= 1;
        if (rem <= 0) {
          clearInterval(cooldownTimer);
          cooldownTimer = null;
          btn.disabled = false;
          btn.textContent = "更新";
        } else {
          btn.textContent = `待機 ${rem}s`;
        }
      }, 1000);
    }

    function saveApiKey() {
      const val = document.getElementById("apiKeyInput").value.trim();
      apiKey = val;
      localStorage.setItem("twelvedata_api_key", val);
      document.getElementById("apiStatus").textContent = val ? "✅ 保存済" : "未設定";
      if (val && !isFetching) checkAll();
    }

    async function copyPrice(btn, priceStr) {
      try {
        await navigator.clipboard.writeText(priceStr);
      } catch (e) {
        const ta = document.createElement("textarea");
        ta.value = priceStr;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand("copy");
        document.body.removeChild(ta);
      }
      const orig = btn.textContent;
      btn.textContent = "✅ コピー済";
      btn.classList.add("copied");
      setTimeout(() => {
        btn.textContent = orig;
        btn.classList.remove("copied");
      }, 1600);
    }

    function pineRsi(closes, length) {
      const n = closes.length;
      const rsi = new Array(n).fill(50);
      if (n <= length) return rsi;
      let gainSum = 0, lossSum = 0;
      for (let i = 1; i <= length; i++) {
        const diff = closes[i] - closes[i - 1];
        if (diff > 0) gainSum += diff;
        else lossSum -= diff;
      }
      let avgGain = gainSum / length;
      let avgLoss = lossSum / length;
      rsi[length] = avgLoss === 0 ? 100 : 100 - (100 / (1 + avgGain / avgLoss));
      for (let i = length + 1; i < n; i++) {
        const diff = closes[i] - closes[i - 1];
        const g = diff > 0 ? diff : 0;
        const l = diff < 0 ? -diff : 0;
        avgGain = (avgGain * (length - 1) + g) / length;
        avgLoss = (avgLoss * (length - 1) + l) / length;
        rsi[i] = avgLoss === 0 ? 100 : 100 - (100 / (1 + avgGain / avgLoss));
      }
      return rsi;
    }

    function pineEma(values, length) {
      const k = 2 / (length + 1);
      const out = [values[0]];
      for (let i = 1; i < values.length; i++) {
        out.push(values[i] * k + out[i - 1] * (1 - k));
      }
      return out;
    }

    function wima(values, length) {
      const out = new Array(values.length).fill(0);
      out[0] = values[0] / length;
      for (let i = 1; i < values.length; i++) {
        out[i] = (values[i] + out[i - 1] * (length - 1)) / length;
      }
      return out;
    }

    function analyzeQQE(pair, bars, fast = 2.618, slow = 4.236, rsiLen = 14, sf = 2) {
      const closes = bars.map(b => b.close);
      const n = closes.length;
      const rawRsi = pineRsi(closes, rsiLen);
      const rsIndex = pineEma(rawRsi, sf);
      const tr = new Array(n).fill(0);
      for (let i = 1; i < n; i++) {
        const th = rsIndex[i - 1] > rsIndex[i] ? rsIndex[i - 1] : rsIndex[i];
        const tl = rsIndex[i - 1] < rsIndex[i] ? rsIndex[i - 1] : rsIndex[i];
        tr[i] = th - tl;
      }
      const atrRsi = wima(tr, 14);
      const smoothedAtrRsi = wima(atrRsi, 14);
      const deltaFast = smoothedAtrRsi.map(v => v * fast);
      const deltaSlow = smoothedAtrRsi.map(v => v * slow);

      const longband = new Array(n).fill(0), shortband = new Array(n).fill(0), trend = new Array(n).fill(1), fastTL = new Array(n).fill(0);
      const longband1 = new Array(n).fill(0), shortband1 = new Array(n).fill(0), trend1 = new Array(n).fill(1), slowTL = new Array(n).fill(0);

      for (let i = 1; i < n; i++) {
        const newShort = rsIndex[i] + deltaFast[i];
        const newLong = rsIndex[i] - deltaFast[i];
        longband[i] = (rsIndex[i - 1] > longband[i - 1] && rsIndex[i] > longband[i - 1]) ? Math.max(longband[i - 1], newLong) : newLong;
        shortband[i] = (rsIndex[i - 1] < shortband[i - 1] && rsIndex[i] < shortband[i - 1]) ? Math.min(shortband[i - 1], newShort) : newShort;
        const crossUpFast = rsIndex[i - 1] <= shortband[i - 1] && rsIndex[i] > shortband[i - 1];
        const crossDownFast = longband[i - 1] <= rsIndex[i - 1] && longband[i - 1] > rsIndex[i];
        trend[i] = crossUpFast ? 1 : (crossDownFast ? -1 : trend[i - 1]);
        fastTL[i] = trend[i] === 1 ? longband[i] : shortband[i];

        const newShort1 = rsIndex[i] + deltaSlow[i];
        const newLong1 = rsIndex[i] - deltaSlow[i];
        longband1[i] = (rsIndex[i - 1] > longband1[i - 1] && rsIndex[i] > longband1[i - 1]) ? Math.max(longband1[i - 1], newLong1) : newLong1;
        shortband1[i] = (rsIndex[i - 1] < shortband1[i - 1] && rsIndex[i] < shortband1[i - 1]) ? Math.min(shortband1[i - 1], newShort1) : newShort1;
        const crossUpSlow = rsIndex[i - 1] <= shortband1[i - 1] && rsIndex[i] > shortband1[i - 1];
        const crossDownSlow = longband1[i - 1] <= rsIndex[i - 1] && longband1[i - 1] > rsIndex[i];
        trend1[i] = crossUpSlow ? 1 : (crossDownSlow ? -1 : trend1[i - 1]);
        slowTL[i] = trend1[i] === 1 ? longband1[i] : shortband1[i];
      }

      const last = n - 1, prev = n - 2;
      const isBuyNow = fastTL[last] > slowTL[last];
      const wasBuyPrev = fastTL[prev] > slowTL[prev];

      // 損切り（SL）価格の計算（直近6本の最安値/最高値の5pips外側）
      const isJpy = pair.endsWith("/JPY");
      const decimals = isJpy ? 3 : 5;
      const pipUnit = isJpy ? 0.01 : 0.0001;
      const buffer = isJpy ? 0.05 : 0.0005;
      const minSlDist = isJpy ? 0.15 : 0.0015; // 最低15pips
      const maxSlDist = isJpy ? 0.80 : 0.0080; // 最大80pips

      const recentSlice = bars.slice(-6);
      const recentLow = Math.min(...recentSlice.map(b => b.low));
      const recentHigh = Math.max(...recentSlice.map(b => b.high));
      const closeNow = closes[last];

      let slPrice = 0;
      let slPips = 0;

      if (isBuyNow) {
        let rawSl = recentLow - buffer;
        let dist = closeNow - rawSl;
        if (dist < minSlDist) dist = minSlDist;
        if (dist > maxSlDist) dist = maxSlDist;
        slPrice = closeNow - dist;
        slPips = Math.round(dist / pipUnit);
      } else {
        let rawSl = recentHigh + buffer;
        let dist = rawSl - closeNow;
        if (dist < minSlDist) dist = minSlDist;
        if (dist > maxSlDist) dist = maxSlDist;
        slPrice = closeNow + dist;
        slPips = Math.round(dist / pipUnit);
      }

      return {
        isBuy: isBuyNow,
        flipped: isBuyNow !== wasBuyPrev,
        close: closeNow.toFixed(decimals),
        greenFast: fastTL[last].toFixed(2),
        redSlow: slowTL[last].toFixed(2),
        slPrice: slPrice.toFixed(decimals),
        slPips
      };
    }

    async function fetch1HourBars(pair) {
      const url = `https://api.twelvedata.com/time_series?symbol=${encodeURIComponent(pair)}&interval=1h&outputsize=120&apikey=${encodeURIComponent(apiKey)}`;
      const res = await fetch(url, { cache: "no-store" });
      const data = await res.json();
      if (data.status === "error" || !data.values) {
        throw new Error(data.message || "APIエラー");
      }
      const asc = [...data.values].reverse();
      const lastBar = asc[asc.length - 1];
      return {
        lastTime: lastBar.datetime,
        bars: asc.map(v => ({
          high: parseFloat(v.high),
          low: parseFloat(v.low),
          close: parseFloat(v.close)
        }))
      };
    }

    async function checkAll() {
      const banner = document.getElementById("statusBanner");
      const grid = document.getElementById("cards");
      const btn = document.getElementById("updateBtn");

      if (!apiKey) {
        banner.textContent = "上の入力欄に Twelve Data APIキーを貼り付けて「保存」を押してください";
        return;
      }

      if (isFetching) return;
      isFetching = true;
      if (btn) {
        btn.disabled = true;
        btn.textContent = "取得中...";
      }

      banner.className = "banner";
      banner.textContent = "1時間足 QQEシグナル(8通貨)を取得中...";
      grid.innerHTML = "";

      const fast = Number(document.getElementById("fastParam").value) || 2.618;
      const slow = Number(document.getElementById("slowParam").value) || 4.236;
      const rsiLen = Number(document.getElementById("rsiParam").value) || 14;
      const sf = Number(document.getElementById("sfParam").value) || 2;

      const results = [];
      for (const item of PAIRS) {
        try {
          const h1Data = await fetch1HourBars(item.code);
          const analyzed = analyzeQQE(item.code, h1Data.bars, fast, slow, rsiLen, sf);
          results.push({ ...item, lastTime: h1Data.lastTime, ...analyzed });
        } catch (err) {
          results.push({ ...item, error: err.message || "取得エラー" });
        }
      }

      // シグナルが転換（利確＆ドテン）した通貨を一番上に並べる
      results.sort((a, b) => {
        if (a.error) return 1;
        if (b.error) return -1;
        return (b.flipped ? 10 : 0) - (a.flipped ? 10 : 0);
      });

      const valid = results.find(r => !r.error);
      const hasRateLimit = results.some(r => r.error && r.error.includes("API credits"));
      const timeLabel = valid ? `最新足: ${valid.lastTime}` : "";
      const flippedList = results.filter(r => !r.error && r.flipped);

      if (hasRateLimit) {
        banner.className = "banner alert";
        banner.textContent = "⏳ 1分間のAPI回数上限に達しました。1分待ってから「更新」を押してください。";
      } else if (flippedList.length > 0) {
        banner.className = "banner alert";
        banner.innerHTML = `🔄 シグナル転換（利確＆ドテン）: ${flippedList.map(f => `${f.jp}(${f.isBuy ? "BUY" : "SELL"})`).join(" / ")}<br><span class="meta">${timeLabel}</span>`;
      } else {
        const buyCount = results.filter(r => !r.error && r.isBuy).length;
        const sellCount = results.filter(r => !r.error && !r.isBuy).length;
        banner.innerHTML = `<span style="color:#34d399;">▲ BUY: ${buyCount}通貨</span> ／ <span style="color:#f87171;">▼ SELL: ${sellCount}通貨</span><br><span class="meta">${timeLabel}</span>`;
      }

      for (const r of results) {
        const card = document.createElement("div");
        if (r.error) {
          const shortErr = r.error.includes("API credits") ? "1分間の制限待機中（1分後に再更新）" : r.error;
          card.className = "card";
          card.innerHTML = `
            <div class="pair-title"><span class="pair-en">${r.code}</span><span class="pair-jp">${r.jp}</span></div>
            <div class="meta">${shortErr}</div>
          `;
        } else {
          card.className = `card ${r.isBuy ? "buy-card" : "sell-card"}${r.flipped ? " flipped" : ""}`;
          card.innerHTML = `
            <div>
              <div class="pair-title">
                <span class="pair-en">${r.code}</span>
                <span class="pair-jp">${r.jp}</span>
              </div>
              ${r.flipped ? '<div class="flip-tag">🔄 転換（利確＆ドテン）</div>' : ""}
              <div class="signal-box ${r.isBuy ? "signal-buy" : "signal-sell"}">
                ${r.isBuy ? "▲ BUY（買い）" : "▼ SELL（売り）"}
              </div>
              <div class="rates-box">
                現在値: <strong>${r.close}</strong><br>
                🟢${r.greenFast} / 🔴${r.redSlow}
              </div>
            </div>
            <div class="sl-row">
              <div class="sl-info">
                <span class="sl-label">🛑 損切り目安 (-${r.slPips}p)</span>
                <span class="sl-val">${r.slPrice}</span>
              </div>
              <button class="copy-btn" onclick="copyPrice(this, '${r.slPrice}')">コピー</button>
            </div>
          `;
        }
        grid.appendChild(card);
      }

      isFetching = false;
      startCooldown(62);
    }

    if (apiKey) {
      checkAll();
    }
  </script>
</body>
</html>
