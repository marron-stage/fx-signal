<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>日足 200EMA + OCO利確・損切り目安 (8通貨)</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --card-sub: #0f172a;
      --border: #334155;
      --text: #f8fafc;
      --muted: #94a3b8;
      --buy: #10b981;
      --sell: #ef4444;
      --accent: #38bdf8;
      --warn: #facc15;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 10px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    .container { max-width: 960px; margin: 0 auto; }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 6px;
      margin-bottom: 8px;
      flex-wrap: wrap;
    }
    h1 { font-size: 0.98rem; margin: 0; }
    .header-btns { display: flex; gap: 6px; align-items: center; }
    button, .nav-link {
      background: var(--card);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 7px;
      padding: 6px 10px;
      font-size: 0.75rem;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
    }
    button.primary { background: var(--accent); color: #0f172a; border: none; padding: 6px 13px; }
    .nav-link { background: #334155; color: #e2e8f0; border: none; }
    button:active { opacity: 0.85; }

    .banner {
      padding: 9px 10px;
      border-radius: 8px;
      margin-bottom: 10px;
      font-weight: 700;
      text-align: center;
      background: var(--card);
      border: 1px solid var(--border);
      font-size: 0.82rem;
      line-height: 1.45;
    }
    .meta { font-size: 0.69rem; color: var(--muted); font-weight: 400; }

    /* スマホ横2列・PC横4列 */
    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
    }
    @media (min-width: 720px) {
      .grid { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 9px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-width: 0;
    }
    .card.up-strong {
      border: 1.5px solid rgba(16, 185, 129, 0.65);
      background: linear-gradient(180deg, rgba(16, 185, 129, 0.08) 0%, var(--card) 100%);
    }
    .card.down-strong {
      border: 1.5px solid rgba(239, 68, 68, 0.65);
      background: linear-gradient(180deg, rgba(239, 68, 68, 0.08) 0%, var(--card) 100%);
    }

    .pair-title {
      display: flex;
      flex-direction: column;
      line-height: 1.2;
      margin-bottom: 5px;
    }
    .pair-en { font-size: 0.94rem; font-weight: 800; }
    .pair-jp { font-size: 0.72rem; color: #cbd5e1; font-weight: 600; margin-top: 1px; }

    .dir-badge {
      display: block;
      text-align: center;
      padding: 5px 4px;
      border-radius: 6px;
      font-size: 0.76rem;
      font-weight: 800;
      margin-bottom: 6px;
    }
    .dir-up {
      background: rgba(16, 185, 129, 0.22);
      color: #34d399;
      border: 1px solid rgba(16, 185, 129, 0.45);
    }
    .dir-down {
      background: rgba(239, 68, 68, 0.22);
      color: #f87171;
      border: 1px solid rgba(239, 68, 68, 0.45);
    }
    .dir-mix {
      background: rgba(148, 163, 184, 0.14);
      color: #cbd5e1;
      border: 1px solid rgba(148, 163, 184, 0.3);
    }

    .rates-box {
      background: var(--card-sub);
      border-radius: 6px;
      padding: 5px 6px;
      font-size: 0.69rem;
      line-height: 1.45;
      margin-bottom: 6px;
      color: #cbd5e1;
    }

    .oco-box {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .target-row {
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 5px 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 4px;
    }
    .target-info {
      display: flex;
      flex-direction: column;
      line-height: 1.25;
      min-width: 0;
    }
    .target-label {
      font-size: 0.63rem;
      font-weight: 700;
    }
    .tp-label { color: #34d399; }
    .sl-label { color: #f87171; }
    .target-val {
      font-size: 0.84rem;
      font-weight: 800;
      color: #f8fafc;
      font-variant-numeric: tabular-nums;
    }
    .copy-btn {
      background: #334155;
      color: #f8fafc;
      border: none;
      border-radius: 5px;
      padding: 5px 7px;
      font-size: 0.66rem;
      font-weight: 700;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .copy-btn.copied {
      background: #10b981;
      color: #0f172a;
    }
    .wait-msg {
      text-align: center;
      font-size: 0.68rem;
      color: var(--muted);
      padding: 8px 4px;
      background: rgba(15, 23, 42, 0.45);
      border-radius: 6px;
    }

    .settings {
      margin-top: 14px;
      padding: 10px;
      background: var(--card);
      border-radius: 8px;
      font-size: 0.74rem;
      color: var(--muted);
      line-height: 1.55;
    }
    .settings input {
      background: var(--card-sub);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 5px;
      width: 54px;
      padding: 3px 5px;
      margin: 2px 4px;
      font-size: 0.74rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>📊 日足 200EMA + OCO目安 (8通貨)</h1>
      <div class="header-btns">
        <a href="./1h.html" class="nav-link">⏱ 1時間足へ</a>
        <button class="primary" onclick="checkAll()">更新</button>
      </div>
    </header>

    <div id="statusBanner" class="banner">日足データとOCO目安を計算中...</div>

    <div id="cards" class="grid"></div>

    <div class="settings">
      <strong>OCO自動計算ルール：</strong>
      利確倍率 <input id="rrRatio" type="number" step="0.1" value="1.5" />倍
      ／ 参照日数 <input id="lookbackDays" type="number" min="3" max="15" value="5" />日
      <button onclick="checkAll()">再計算</button>
      <div style="margin-top: 4px;">
        ・<strong>上目線（買い）：</strong>直近5日の最安値の少し下を「損切り」、その1.5倍上を「利確」として算出<br>
        ・<strong>下目線（売り）：</strong>直近5日の最高値の少し上を「損切り」、その1.5倍下を「利確」として算出
      </div>
    </div>
  </div>

  <script>
    const PAIRS = [
      { code: "EUR/USD", jp: "ユーロ/ドル" },
      { code: "USD/JPY", jp: "ドル/円" },
      { code: "GBP/USD", jp: "ポンド/ドル" },
      { code: "EUR/JPY", jp: "ユーロ/円" },
      { code: "GBP/JPY", jp: "ポンド/円" },
      { code: "AUD/USD", jp: "豪ドル/ドル" },
      { code: "AUD/JPY", jp: "豪ドル/円" },
      { code: "GBP/AUD", jp: "ポンド/豪ドル" }
    ];

    async function copyPrice(btn, priceStr) {
      try {
        await navigator.clipboard.writeText(priceStr);
      } catch (e) {
        const ta = document.createElement("textarea");
        ta.value = priceStr;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand("copy");
        document.body.removeChild(ta);
      }
      const orig = btn.textContent;
      btn.textContent = "✅ コピー済";
      btn.classList.add("copied");
      setTimeout(() => {
        btn.textContent = orig;
        btn.classList.remove("copied");
      }, 1600);
    }

    function calcEma(values, length) {
      const k = 2 / (length + 1);
      const out = [values[0]];
      for (let i = 1; i < values.length; i++) {
        out.push(values[i] * k + out[i - 1] * (1 - k));
      }
      return out;
    }

    async function fetchDailyCloses(base, quote) {
      const end = new Date(Date.now() + 9 * 60 * 60 * 1000 + 24 * 60 * 60 * 1000);
      const start = new Date(end.getTime() - 335 * 24 * 60 * 60 * 1000);
      const fmt = d => d.toISOString().split("T")[0];
      const url = `https://api.frankfurter.dev/v1/${fmt(start)}..${fmt(end)}?base=${base}&symbols=${quote}&_=${Date.now()}`;
      const res = await fetch(url, { cache: "no-store" });
      if (!res.ok) throw new Error("取得失敗");
      const data = await res.json();
      const dates = Object.keys(data.rates).sort();
      return {
        dates,
        closes: dates.map(d => data.rates[d][quote])
      };
    }

    async function checkAll() {
      const banner = document.getElementById("statusBanner");
      const grid = document.getElementById("cards");
      const rrRatio = Number(document.getElementById("rrRatio").value) || 1.5;
      const lookback = Number(document.getElementById("lookbackDays").value) || 5;

      banner.textContent = "8通貨の日足200EMAとOCO目安を計算中...";
      grid.innerHTML = "";

      const results = await Promise.all(PAIRS.map(async (item) => {
        const [base, quote] = item.code.split("/");
        try {
          const { dates, closes } = await fetchDailyCloses(base, quote);
          const ema200Arr = calcEma(closes, 200);
          const last = closes.length - 1;
          const prev = closes.length - 2;

          const closeNow = closes[last];
          const emaNow = ema200Arr[last];
          const emaPrev = ema200Arr[prev];

          const aboveEma = closeNow > emaNow;
          const emaRising = emaNow >= emaPrev;

          const isJpy = quote === "JPY";
          const decimals = isJpy ? 3 : 5;
          const pipUnit = isJpy ? 0.01 : 0.0001;
          const buffer = isJpy ? 0.15 : 0.0015;    // 直近安値・高値の15pips外側
          const minSlDist = isJpy ? 0.40 : 0.0040; // 日足最低40pips幅
          const maxSlDist = isJpy ? 1.50 : 0.0150; // 日足最大150pips幅

          let direction = "mix";
          if (aboveEma && emaRising) direction = "up";
          else if (!aboveEma && !emaRising) direction = "down";

          // 直近N日間の終値ベース安値・高値からOCOラインを算出
          const recentSlice = closes.slice(-lookback);
          const recentLow = Math.min(...recentSlice);
          const recentHigh = Math.max(...recentSlice);

          let slPrice = 0;
          let tpPrice = 0;
          let slPips = 0;
          let tpPips = 0;

          if (direction === "up") {
            let rawSl = recentLow - buffer;
            let dist = closeNow - rawSl;
            if (dist < minSlDist) dist = minSlDist;
            if (dist > maxSlDist) dist = maxSlDist;
            slPrice = closeNow - dist;
            tpPrice = closeNow + dist * rrRatio;
            slPips = Math.round(dist / pipUnit);
            tpPips = Math.round((dist * rrRatio) / pipUnit);
          } else if (direction === "down") {
            let rawSl = recentHigh + buffer;
            let dist = rawSl - closeNow;
            if (dist < minSlDist) dist = minSlDist;
            if (dist > maxSlDist) dist = maxSlDist;
            slPrice = closeNow + dist;
            tpPrice = closeNow - dist * rrRatio;
            slPips = Math.round(dist / pipUnit);
            tpPips = Math.round((dist * rrRatio) / pipUnit);
          }

          return {
            ...item,
            lastDate: dates[last],
            close: closeNow.toFixed(decimals),
            ema200: emaNow.toFixed(decimals),
            emaRising,
            direction,
            slPrice: slPrice.toFixed(decimals),
            tpPrice: tpPrice.toFixed(decimals),
            slPips,
            tpPips
          };
        } catch (err) {
          return { ...item, error: true };
        }
      }));

      // 上目線・下目線がハッキリしている通貨を上に並べる
      results.sort((a, b) => {
        if (a.error) return 1;
        if (b.error) return -1;
        const score = r => (r.direction === "up" || r.direction === "down") ? 10 : 0;
        return score(b) - score(a);
      });

      const valid = results.find(r => !r.error);
      const dateStr = valid ? `最新確定日足: ${valid.lastDate}` : "";
      const upList = results.filter(r => r.direction === "up");
      const downList = results.filter(r => r.direction === "down");

      banner.innerHTML = `
        <span style="color:#34d399;">📈 上目線(買い): ${upList.length}通貨</span> ／ 
        <span style="color:#f87171;">📉 下目線(売り): ${downList.length}通貨</span><br>
        <span class="meta">${dateStr}（API制限なし・無料）</span>
      `;

      for (const r of results) {
        const card = document.createElement("div");
        card.className = "card" + (r.direction === "up" ? " up-strong" : r.direction === "down" ? " down-strong" : "");

        if (r.error) {
          card.innerHTML = `
            <div class="pair-title">
              <span class="pair-en">${r.code}</span>
              <span class="pair-jp">${r.jp}</span>
            </div>
            <div class="meta">取得エラー</div>
          `;
        } else {
          let badgeHtml = "";
          let ocoHtml = "";

          if (r.direction === "up") {
            badgeHtml = `<div class="dir-badge dir-up">📈 上目線（押し目買い）</div>`;
          } else if (r.direction === "down") {
            badgeHtml = `<div class="dir-badge dir-down">📉 下目線（戻り売り）</div>`;
          } else {
            badgeHtml = `<div class="dir-badge dir-mix">⚠️ 方向迷い中</div>`;
          }

          if (r.direction === "up" || r.direction === "down") {
            ocoHtml = `
              <div class="oco-box">
                <div class="target-row">
                  <div class="target-info">
                    <span class="target-label tp-label">🎯 利確 (+${r.tpPips}p)</span>
                    <span class="target-val">${r.tpPrice}</span>
                  </div>
                  <button class="copy-btn" onclick="copyPrice(this, '${r.tpPrice}')">コピー</button>
                </div>
                <div class="target-row">
                  <div class="target-info">
                    <span class="target-label sl-label">🛑 損切り (-${r.slPips}p)</span>
                    <span class="target-val">${r.slPrice}</span>
                  </div>
                  <button class="copy-btn" onclick="copyPrice(this, '${r.slPrice}')">コピー</button>
                </div>
              </div>
            `;
          } else {
            ocoHtml = `<div class="wait-msg">200EMAと価格の向きが不一致のため見送り</div>`;
          }

          card.innerHTML = `
            <div>
              <div class="pair-title">
                <span class="pair-en">${r.code}</span>
                <span class="pair-jp">${r.jp}</span>
              </div>
              ${badgeHtml}
              <div class="rates-box">
                基準値: <strong>${r.close}</strong><br>
                200EMA: <strong>${r.ema200}</strong> (${r.emaRising ? "↗" : "↘"})
              </div>
            </div>
            ${ocoHtml}
          `;
        }
        grid.appendChild(card);
      }
    }

    checkAll();
  </script>
</body>
</html>
